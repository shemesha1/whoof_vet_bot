# Пример nginx для вебхука магазина (нужен, только если WEBHOOK_ENABLED=true).
# Замените bot.example.ru на свой домен, затем выпустите сертификат: sudo certbot --nginx -d bot.example.ru

server {
    listen 80;
    server_name bot.example.ru;

    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }
}
